name: Draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository
        run: python3 scripts/check_repository.py
      - name: Create draft for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo 'Use a version such as v0.1.0 or v0.1.0-rc.1.'
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo 'This version tag already exists; refusing to overwrite it.'
            exit 1
          fi
          release_args=(--repo "$GH_REPO" --target "$TARGET_SHA" --title "$VERSION" --generate-notes --draft)
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$VERSION" "${release_args[@]}"
