name: 问题反馈 / Bug report
description: 报告一个可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请勿提交密钥、个人数据或安全漏洞细节。"
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 操作系统、项目版本、运行方式
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可重复步骤和脱敏样例
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图（可选，请脱敏）
